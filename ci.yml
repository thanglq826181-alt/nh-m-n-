name: FreshVend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: freshvend_db
          POSTGRES_USER: freshvend
          POSTGRES_PASSWORD: freshvend-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freshvend -d freshvend_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://freshvend:freshvend-ci@localhost:5432/freshvend_db?schema=public
      TEST_DATABASE_URL: postgresql://freshvend:freshvend-ci@localhost:5432/freshvend_db?schema=public
      JWT_SECRET: freshvend-ci-jwt-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm test
      - run: npm run build
      - run: docker build --tag freshvend-api-ci .
      - run: docker compose --env-file .env.release.example -f docker-compose.release.yml config --quiet

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
